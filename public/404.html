<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Page not found | Solomon Ashagre</title>
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <style>
    :root { color-scheme: dark light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center;
      font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif; background: #0a0b10; color: #eceef4; }
    @media (prefers-color-scheme: light) { body { background: #f6f5f1; color: #111318; } }
    code { font-family: ui-monospace, SFMono-Regular, monospace; color: #c8f169; font-size: 14px; letter-spacing: .2em; }
    @media (prefers-color-scheme: light) { code { color: #3f6212; } }
    h1 { font-size: clamp(2.5rem, 9vw, 5rem); line-height: 1.05; margin: 14px 0 12px; letter-spacing: -0.03em; }
    p { color: #a2a8b8; max-width: 30rem; margin: 0 auto 28px; line-height: 1.7; }
    a { display: inline-block; background: #c8f169; color: #0a0b10; font-weight: 600; text-decoration: none;
      padding: 14px 26px; border-radius: 999px; transition: transform .2s, box-shadow .2s; }
    a:hover { transform: translateY(-2px); box-shadow: 0 10px 30px -10px #c8f169; }
  </style>
</head>
<body>
  <main>
    <code>ERROR 404</code>
    <h1>Page not found</h1>
    <p>The page you are looking for does not exist or has moved. Let's get you back to the portfolio.</p>
    <a href="/">Back to home</a>
  </main>
</body>
</html>
